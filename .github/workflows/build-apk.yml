name: Build Life Manager Pro APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          best=""; bt=0
          for f in *.zip; do
            unzip -l "$f" 2>/dev/null | grep -q 'LifeManagerPro/ci/build.sh' || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$bt" ]; then bt="${t:-0}"; best="$f"; fi
          done
          test -n "$best" || { echo "No LifeManagerPro zip found in the repository"; exit 1; }
          echo "Using $best"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$best" -d "$RUNNER_TEMP/src"
          bash "$RUNNER_TEMP/src/LifeManagerPro/ci/build.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: LifeManagerPro-apk
          path: LifeManagerPro.apk
